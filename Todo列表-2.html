<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo 列表 V2.0 完整版</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center;
      padding: 48px 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 100%); color: #1f2937;
    }
    .app {
      width: 100%; max-width: 520px; background: #ffffff; border-radius: 16px; padding: 28px 24px 24px;
      box-shadow: 0 10px 30px rgba(15,23,42,0.08), 0 2px 6px rgba(15,23,42,0.04);
    }
    .app h1 { margin: 0 0 4px; font-size: 22px; font-weight: 600; }
    .app .subtitle { margin: 0 0 20px; font-size: 13px; color: #6b7280; }
    .input-row { display: flex; gap: 10px; }
    #todo-input {
      flex: 1; min-width: 0; height: 42px; padding: 0 14px; font-size: 14px; color: #1f2937;
      background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 10px; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    #todo-input:focus { background: #ffffff; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    #add-btn {
      height: 42px; padding: 0 20px; font-size: 14px; font-weight: 500; color: #ffffff;
      background: #6366f1; border: none; border-radius: 10px; cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }
    #add-btn:hover { background: #4f46e5; }
    #add-btn:active { transform: scale(0.97); }
    .meta { display: flex; justify-content: space-between; align-items: center; margin: 18px 2px 8px; font-size: 12px; color: #9ca3af; }
    .filters { display: flex; gap: 8px; margin: 12px 0 12px; }
    .filters button {
      flex: 1; height: 34px; border: 1px solid #e5e7eb; border-radius: 8px;
      background: #f9fafb; color: #4b5563; font-size: 13px; cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .filters button:hover { background: #eef2ff; }
    .filters button.active { background: #6366f1; border-color: #6366f1; color: #ffffff; }
    #todo-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    #todo-list li {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 14px; font-size: 14px; line-height: 1.5; color: #374151;
      background: #f9fafb; border: 1px solid #eef0f3; border-left: 3px solid #6366f1;
      border-radius: 8px; cursor: pointer; user-select: none; animation: fadeIn 0.18s ease-out;
    }
    #todo-list li .text { flex: 1; word-break: break-word; }
    #todo-list li.done { border-left-color: #9ca3af; background: #f3f4f6; }
    #todo-list li.done .text { text-decoration: line-through; color: #9ca3af; }
    .del-btn {
      width: 28px; height: 28px; flex: 0 0 auto; border: none; border-radius: 6px;
      background: transparent; color: #9ca3af; font-size: 18px; line-height: 1; cursor: pointer;
    }
    .del-btn:hover { background: #fee2e2; color: #dc2626; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .empty-tip {
      padding: 28px 0; text-align: center; font-size: 13px; color: #9ca3af;
      border: 1px dashed #e5e7eb; border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Todo 列表</h1>
    <p class="subtitle">V2.0 完整版 · 数据驱动 + 筛选 + localStorage</p>

    <div class="input-row">
      <input id="todo-input" type="text" placeholder="输入待办事项，按回车或点击添加" autocomplete="off">
      <button id="add-btn" type="button">添加</button>
    </div>

    <div class="meta">
      <span>共 <strong id="todo-count">0</strong> 项</span>
      <span id="filter-tip">当前：全部</span>
    </div>

    <div class="filters">
      <button type="button" data-filter="all" class="active">全部</button>
      <button type="button" data-filter="active">未完成</button>
      <button type="button" data-filter="done">已完成</button>
    </div>

    <ul id="todo-list"></ul>
    <div id="empty-tip" class="empty-tip">暂无待办，先添加一条吧～</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const KEY = 'todos';
      const input = document.getElementById('todo-input');
      const addBtn = document.getElementById('add-btn');
      const list = document.getElementById('todo-list');
      const countEl = document.getElementById('todo-count');
      const emptyTip = document.getElementById('empty-tip');
      const filterTip = document.getElementById('filter-tip');
      const filterButtons = document.querySelectorAll('[data-filter]');

      if (!input || !addBtn || !list || !countEl || !emptyTip) {
        console.error('Todo 初始化失败：缺少必要 DOM 元素');
        return;
      }

      // 单一数据源：从 localStorage 恢复
      let todos = load();
      // 视图状态：不持久化
      let filter = 'all';

      // 保存：把 todos 写入 localStorage
      function save() {
        localStorage.setItem(KEY, JSON.stringify(todos));
      }

      // 读取：从 localStorage 恢复 todos
      function load() {
        const raw = localStorage.getItem(KEY);
        if (raw === null) return [];

        try {
          const data = JSON.parse(raw);
          if (!Array.isArray(data)) return [];

          return data.filter(item =>
            item && typeof item === 'object' && typeof item.text === 'string'
          );
        } catch (err) {
          console.warn('读取 localStorage 失败，已回退为空列表', err);
          return [];
        }
      }

      // 重渲染：先过滤，再重建整个列表
      function render() {
        list.textContent = '';

        const shown = todos.filter(t => {
          if (filter === 'active') return !t.completed;
          if (filter === 'done') return t.completed;
          return true;
        });

        const fragment = document.createDocumentFragment();

        shown.forEach(t => {
          const li = document.createElement('li');
          li.dataset.id = t.id;
          if (t.completed) li.classList.add('done');

          const textSpan = document.createElement('span');
          textSpan.className = 'text';
          textSpan.textContent = t.text;
          li.appendChild(textSpan);

          const delBtn = document.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'del-btn';
          delBtn.textContent = '×';
          delBtn.setAttribute('aria-label', '删除');
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            removeTodo(t.id);
          });
          li.appendChild(delBtn);

          li.addEventListener('click', () => toggleTodo(t.id));
          fragment.appendChild(li);
        });

        list.appendChild(fragment);
        countEl.textContent = String(todos.length);

        emptyTip.style.display = shown.length === 0 ? 'block' : 'none';
        emptyTip.textContent = todos.length === 0
          ? '暂无待办，先添加一条吧～'
          : '当前筛选下没有任务';

        if (filterTip) {
          filterTip.textContent =
            filter === 'all' ? '当前：全部' :
            filter === 'active' ? '当前：未完成' : '当前：已完成';
        }

        filterButtons.forEach(btn => {
          btn.classList.toggle('active', btn.dataset.filter === filter);
        });
      }

      // 添加：改数据 → 保存 → 重渲染
      function addTodo() {
        const text = input.value.trim();

        if (!text) {
          alert('请输入内容');
          input.focus();
          return;
        }

        if (todos.some(t => t.text === text)) {
          alert('该待办已存在');
          input.focus();
          return;
        }

        const todo = { id: Date.now(), text, completed: false };
        todos = [...todos, todo];
        save();
        render();

        input.value = '';
        input.focus();
      }

      // 删除：filter 生成新数组 → 保存 → 重渲染
      function removeTodo(id) {
        todos = todos.filter(t => t.id !== id);
        save();
        render();
      }

      // 切换：map + 展开 → 保存 → 重渲染
      function toggleTodo(id) {
        todos = todos.map(t =>
          t.id === id ? { ...t, completed: !t.completed } : t
        );
        save();
        render();
      }

      // 脱离 AI 小改：删除所有已完成任务
      function clearCompleted() {
        todos = todos.filter(t => !t.completed);
        save();
        render();
      }

      // 筛选：只改视图状态，不 save
      function setFilter(f) {
        filter = f;
        render();
      }

      addBtn.addEventListener('click', addTodo);
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') addTodo();
      });

      filterButtons.forEach(btn => {
        btn.addEventListener('click', () => setFilter(btn.dataset.filter));
      });

      // 便于控制台验证 clearCompleted()
      window.clearCompleted = clearCompleted;
      window.setFilter = setFilter;

      render();
    });
  </script>
</body>
</html>
